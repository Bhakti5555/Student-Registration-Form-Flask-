<!DOCTYPE html>
<html>
<head>
    <title>Delete Student</title>
    <style>
        body {
            font-family: Arial;
            background: #f5f5f5;
            text-align: center;
        }
        input {
            padding: 10px;
            width: 250px;
            margin: 12px;
        }
        button {
            padding: 10px 18px;
            font-size: 16px;
            background: crimson;
            border: none;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background: rgb(190, 10, 48);
        }
        .msg {
            margin-top: 20px;
            font-size: 18px;
            color: #333;
        }
    </style>
</head>
<body>

    <h2>Delete Student</h2>

    <form method="POST">
        <input type="number" name="roll" placeholder="Enter Roll Number" required>
        <button type="submit">Delete</button>
    </form>

    <div style="margin-top: 20px;">
    <a href="/" style="
        text-decoration:none;
        padding:10px 20px;
        background:#4CAF50;
        color:white;
        border-radius:6px;
        font-size:16px;
    "> Back to Home</a>
    </div>

    {% if message %}
    <p class="msg">{{ message }}</p>
    {% endif %}

</body>
</html>
