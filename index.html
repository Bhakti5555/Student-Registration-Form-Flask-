<!DOCTYPE html>
<html>
<head>
    <title>Student Dashboard</title>
    <style>
        body {
            font-family: Arial;

            margin-top: 60px;
        }
        h1 {
            color: #333;
        }
        .btn-box {

        }

<body>

    <h1>Student Management Dashboard</h1>

    <div class="btn-box">
        <a href="/add"> Add Student</a>
